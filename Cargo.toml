[package]
name = "num-dual"
version = "0.15.0"
authors = [
    "Gernot Bauer <bauer@itt.uni-stuttgart.de>",
    "Philipp Rehner <prehner@ethz.ch>",
]
rust-version = "1.89"
edition = "2024"
readme = "README.md"
license = "MIT OR Apache-2.0"
description = "Generalized (hyper) dual numbers for the calculation of exact (partial) derivatives"
homepage = "https://github.com/itt-ustutt/num-dual"
repository = "https://github.com/itt-ustutt/num-dual"
keywords = ["mathematics", "numerics", "differentiation"]
categories = ["data-structures", "science", "mathematics"]
exclude = ["/.github/*", "*.ipynb", "./docs/*"]

[lib]
name = "num_dual"

[dependencies]
num-traits = "0.2"
nalgebra = { version = "0.35", optional = true }
numpy = { version = "0.29", optional = true }
approx = { version = "0.5", optional = true }
simba = { version = "0.10", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
ndarray = { version = "0.17", optional = true }

[dependencies.pyo3]
version = "0.29"
optional = true
features = ["multiple-pymethods"]

[profile.release]
lto = true

[features]
default = ["nalgebra"]
nalgebra = ["dep:nalgebra", "simba", "approx"]
python_macro = []
python = ["pyo3", "nalgebra", "numpy", "python_macro"]

[dev-dependencies]
criterion = "0.8"
serde_json = "1.0"
approx = "0.5"

[[bench]]
name = "benchmark"
harness = false
required-features = ["nalgebra"]